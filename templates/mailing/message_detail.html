{% extends 'base.html' %}

{% block title %}Сообщение: {{ message.subject }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h2 class="mb-0">Сообщение: {{ message.subject }}</h2>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <strong>Тема:</strong>
                    <p>{{ message.subject }}</p>
                </div>
                <div class="mb-3">
                    <strong>Содержание:</strong>
                    <p>{{ message.body }}</p>
                </div>
                <div class="mb-3">
                    <strong>Владелец:</strong>
                    <p>{{ message.owner }}</p>
                </div>
                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <a href="{% url 'mailing:message_list' %}" class="btn btn-secondary me-md-2">Назад к списку</a>
                    <a href="{% url 'mailing:message_update' message.pk %}" class="btn btn-warning me-md-2">Редактировать</a>
                    <a href="{% url 'mailing:message_delete' message.pk %}" class="btn btn-danger">Удалить</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
